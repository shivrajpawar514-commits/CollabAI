name: CollabAI CI/CD Pipeline

on:
  push:
    branches: [ main, release/all-phases ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collabai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Syntax & Import Checks
        env:
          DATABASE_URL: sqlite+aiosqlite:///./collabai_ci.db
          SECRET_KEY: testsecretkeyformockingenvironment12345
          DEFAULT_LLM_PROVIDER: ollama
        run: |
          python -c "import app.main; print('FastAPI Core module successfully imported')"
          python -c "import ai.client; print('AI Client abstraction successfully imported')"
          python -c "import ml.matcher_v3; print('ML Matcher Engine successfully imported')"

      - name: Execute Phase 7 AI Test Suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./collabai_ci.db
          SECRET_KEY: testsecretkeyformockingenvironment12345
          DEFAULT_LLM_PROVIDER: ollama
        run: |
          python backend/tests/test_advanced_ai.py

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compilation & Typecheck
        run: npx tsc --noEmit

      - name: Next.js Production Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
        run: npm run build

  docker-validate:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
